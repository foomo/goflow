#:schema https://mise.jdx.dev/schema/mise.json

[settings]
minimum_release_age = "7d"

[tools]
# https://mise-tools.jdx.dev/tools/actionlint
actionlint = "1.7.12"
# https://mise-tools.jdx.dev/tools/bun
bun = "1.4.4"
# https://mise-tools.jdx.dev/tools/go
go = "1.27.4"
# https://mise-tools.jdx.dev/tools/lefthook
lefthook = "2.2.2"
# https://mise-tools.jdx.dev/tools/golangci-lint
golangci-lint = "2.15.0"
# https://mise-tools.jdx.dev/tools/gotestsum
gotestsum = "1.13.0"
# https://mise-tools.jdx.dev/tools/goreleaser
goreleaser = "2.17.1"
# https://github.com/oligot/go-mod-upgrade/releases
"github:oligot/go-mod-upgrade" = "0.13.0"
# https://github.com/golang/vuln/tags
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
